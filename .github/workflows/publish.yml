name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and origin/main, for the ancestry check
      - name: Check the release before running anything else
        # Fail fast and closed, before install and the check suite. Node is preinstalled on the runner.
        id: release
        run: |
          version=$(node -p 'require("./package.json").version')

          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Merge the release PR first, then tag the merged commit on main (see RELEASE.md)."
            exit 1
          fi

          if ! grep -Eq "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version — YYYY-MM-DD' heading."
            exit 1
          fi

          # Prereleases go to their own dist-tag (1.1.0-beta.0 -> beta) so they never claim `latest`.
          case "$version" in
            *-*)
              pre=${version#*-}
              dist_tag=${pre%%.*}
              if [ -z "$dist_tag" ] || [[ "$dist_tag" =~ ^[0-9]+$ ]]; then
                echo "::error::Prerelease $version has no named identifier to use as the npm dist-tag. Bump with --preid (e.g. pnpm version prerelease --preid beta)."
                exit 1
              fi
              ;;
            *) dist_tag=latest ;;
          esac
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Publish
        # prepublishOnly runs the build and check:pkg.
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}

  # The GitHub release, with the version's changelog section as its notes. A job of its own, so
  # the job that installs and runs dependencies never holds a token that can write to the repo.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Create the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::notice::A GitHub release for $GITHUB_REF_NAME already exists; leaving it as it is."
            exit 0
          fi
          node scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          if [ "$DIST_TAG" = latest ]; then kind=--latest; else kind=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" "$kind" \
            --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIST_TAG: ${{ needs.publish.outputs.dist-tag }}

  # Prereleases keep the docs on the latest stable release.
  docs:
    needs: publish
    if: needs.publish.outputs.dist-tag == 'latest'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ github.ref_name }}
