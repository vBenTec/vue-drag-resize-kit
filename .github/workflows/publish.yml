name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and origin/main, for the ancestry check
      - name: Check the release before running anything else
        # Fail fast and closed, before install and the check suite. Node is preinstalled on the runner.
        id: release
        run: |
          version=$(node -p 'require("./package.json").version')

          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Merge the release PR first, then tag the merged commit on main (see RELEASE.md)."
            exit 1
          fi

          if ! grep -Eq "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version — YYYY-MM-DD' heading."
            exit 1
          fi

          # Prereleases go to their own dist-tag (1.1.0-beta.0 -> beta) so they never claim `latest`.
          case "$version" in
            *-*)
              pre=${version#*-}
              dist_tag=${pre%%.*}
              if [ -z "$dist_tag" ] || [[ "$dist_tag" =~ ^[0-9]+$ ]]; then
                echo "::error::Prerelease $version has no named identifier to use as the npm dist-tag. Bump with --preid (e.g. pnpm version prerelease --preid beta)."
                exit 1
              fi
              ;;
            *) dist_tag=latest ;;
          esac
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Publish
        # prepublishOnly runs the build and check:pkg.
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
